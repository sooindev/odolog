# 운영 전용 덮어쓰기. SPRING_PROFILES_ACTIVE=prod 로 적용
# 여기 적은 키만 덮어씀. 로그·문서 끄기는 기본 application.yml 이 이미 안전한 값

spring:
  # 기본값 없음. 환경변수가 빠지면 root·빈 비밀번호로 조용히 뜨지 않고 기동 실패
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        # https 전제라 환경변수와 무관하게 켬. CsrfTokenFilter 도 같은 값 사용
        secure: true

# 재설정 메일 링크. 기본값(localhost)으로 운영 메일이 나가지 않게 필수
odolog:
  # 배포한 화면 주소. 기본값 없음(빠뜨리면 기동 실패)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  app:
    base-url: ${APP_BASE_URL}
