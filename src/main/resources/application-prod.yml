# 운영 전용 덮어쓰기. SPRING_PROFILES_ACTIVE=prod 로 적용
# 여기 적은 키만 덮어씀

spring:
  jpa:
    # 콘솔 SQL 출력 끄기
    show-sql: false

# API 문서 비활성. 인증 없이 엔드포인트 구조 노출 방지
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# SQL·바인딩 로그 끄기. 개인정보·해시 노출 방지
logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

server:
  servlet:
    session:
      cookie:
        # https 전제라 secure 켜기. CsrfTokenFilter 도 같은 값 사용
        secure: true
