# 운영 전용 덮어쓰기. SPRING_PROFILES_ACTIVE=prod 하나로 아래가 전부 켜진다
#
# application.yml 을 고치지 않고 파일을 따로 둔 이유: 그쪽은 개발용이고,
# 값을 바꾸면 IntelliJ 실행이 같이 달라진다. 스프링은 두 파일을 겹쳐 읽고
# 프로파일 쪽이 이기므로, 여기 적은 키만 덮어쓰고 나머지는 그대로 온다
#
# 주석으로 "배포할 때 끄세요" 라고 적어 두는 것과의 차이가 이 파일의 전부다 —
# 주석은 사람이 기억해야 하고, 프로파일은 환경변수 하나가 대신 기억한다

spring:
  jpa:
    # 콘솔로 나가는 SQL. 로깅 설정과 별개라 따로 꺼야 한다
    show-sql: false

# API 문서를 닫는다
# springdoc 은 인증을 전혀 요구하지 않아서, 켜 둔 채 배포하면 비로그인 방문자가
# 엔드포인트 목록·요청 필드·검증 규칙을 그대로 읽는다.
# CsrfTokenFilter 도 /api 밖은 통과시키므로 여기는 아무 관문도 없다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# bind: trace 는 쿼리에 들어가는 값을 전부 찍는다 — 이메일·닉네임·전화번호와
# BCrypt 해시가 로그 파일에 평문으로 남는다
logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

server:
  servlet:
    session:
      cookie:
        # 개발은 http 라 기본이 false 였다. 운영은 https 가 전제이므로 여기서 켠다.
        # CsrfTokenFilter 가 이 값을 같이 읽으므로 쿠키 둘이 한 번에 바뀐다(3단계)
        secure: true
