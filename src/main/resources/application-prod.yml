# 운영 전용 덮어쓰기. SPRING_PROFILES_ACTIVE=prod 로 적용
# 여기 적은 키만 덮어씀

spring:
  # 기본값 없음. 환경변수가 빠지면 root·빈 비밀번호로 조용히 뜨지 않고 기동 실패
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # 콘솔 SQL 출력 끄기
    show-sql: false

# API 문서 비활성. 인증 없이 엔드포인트 구조 노출 방지
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# SQL·바인딩 로그 끄기. 개인정보·해시 노출 방지
logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info

server:
  servlet:
    session:
      cookie:
        # https 전제라 secure 켜기. CsrfTokenFilter 도 같은 값 사용
        secure: true

# 재설정 메일 링크. 기본값(localhost)으로 운영 메일이 나가지 않게 필수
odolog:
  # 배포한 화면 주소. 기본값 없음(빠뜨리면 기동 실패)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  app:
    base-url: ${APP_BASE_URL}
  # 토큰이 로그에 남으면 로그를 보는 사람이 남의 비밀번호를 바꿀 수 있음
  mail:
    log-link-on-failure: false
