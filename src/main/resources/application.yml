spring:
  application:
    name: odolog

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/odolog
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # 스키마는 Flyway 가 만든다(db/migration). Hibernate 는 맞는지 확인만
  # 운영 DB 는 ddl-auto 로 만들어져 있어 V1 을 적용된 기준점으로 표시하고 V2 부터 실행
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  # 세션 표는 Flyway V3 가 만든다
  session:
    jdbc:
      initialize-schema: never
      # 속성을 넣는 즉시 저장. 로그인이 세션을 저장한 뒤 비밀번호가 그대로인지 다시 확인하려면 필요
      flush-mode: immediate

  # 페이지 크기 상한. 기본 2000 이면 ?size=2000 한 번에 차량·이력이 통째로
  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # 비밀번호 재설정 메일. 자격증명은 환경변수로만
  # Gmail 은 앱 비밀번호 사용. 미설정 시 발송만 실패
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 시간 제한(ms). 없으면 응답 없는 메일 서버에 실행기 스레드가 영구히 묶여 재설정 발급까지 멈춤
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 세션 쿠키 속성 명시. 브라우저 기본값에 기대지 않음
# secure 는 로컬(http) 기본 false, 배포 시 SESSION_COOKIE_SECURE=true
server:
  servlet:
    session:
      # 세션 14일. 톰캣 기본 30분은 기록 도중 로그아웃
      timeout: 14d
      cookie:
        # Spring Session 기본 이름(SESSION) 대신 지금까지의 이름 유지
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        # 쿠키 max-age 도 14일. 세션 쿠키면 브라우저 종료 시 만료
        max-age: 14d

odolog:
  # 화면 주소(CORS). 코드에 박혀 있으면 배포 때 고칠 수 없음
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 재설정 링크의 프런트 주소
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  # 메일 설정이 없는 로컬에서 재설정 흐름을 확인하려고 발송 실패 시 링크를 로그에. 운영은 끔
  mail:
    log-link-on-failure: true

# Swagger UI 의 CSRF 헤더 전송. 운영에서는 문서 비활성(application-prod.yml)
springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

# 개발 전용 SQL 로그. bind: trace 는 이메일·해시까지 출력
# 운영은 application-prod.yml 이 끔
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
