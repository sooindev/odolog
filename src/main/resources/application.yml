spring:
  application:
    name: odolog

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/odolog
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # 비밀번호 재설정 메일. 자격증명은 DB 와 같이 환경변수로만 받는다 — 파일에 적지 않는다.
  # Gmail 이면 2단계 인증을 켜고 "앱 비밀번호"를 발급해 MAIL_PASSWORD 에 넣는다.
  # 값을 안 주면 발송만 실패하고 앱은 뜬다 — 재설정을 안 쓰는 동안 개발이 막히지 않게.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 세션 쿠키 속성을 명시한다. 브라우저 기본값(SameSite=Lax)에 기대지 않는 이유는
# 그 기본값이 브라우저마다·버전마다 달라서다.
#
# secure 는 로컬이 http 라 기본값이 false 다. 켜 두면 쿠키가 아예 전송되지 않아
# 개발이 막힌다. 배포에서는 SESSION_COOKIE_SECURE=true 로 켠다 — 값을 파일에 박지 않고
# 환경변수로 뺀 이유는 DB 자격증명과 같다. 프런트를 다른 출처에 두는 배포라면
# SameSite=None 조합까지 함께 따져야 하고, None 은 secure 없이는 동작하지 않는다.
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

odolog:
  # 재설정 링크가 가리킬 화면 주소. 메일 본문에 들어가므로 백엔드가 아니라 프런트다
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}

# Swagger UI 가 CSRF 쿠키를 읽어 헤더로 실어 보내게 한다.
# 없으면 문서에서 "Try it out" 으로 POST·PATCH·DELETE 를 못 쏜다.
springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

# ⚠️ 아래 두 줄은 개발 전용이다.
# bind: trace 는 쿼리에 들어가는 값을 전부 찍는다 — 이메일·닉네임·전화번호와
# BCrypt 해시가 그대로 로그에 남는다. 배포 환경에서는 반드시 꺼야 한다.
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
