spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/odolog_test
    # 로컬 테스트 전용 계정. odolog_test 스키마 권한만
    username: odolog_test
    password: odolog_test

  # JavaMailSender 빈 생성용 값. 실제 발송 없음
  mail:
    host: localhost
    port: 25

  # 테스트는 매번 빈 스키마. 엔티티 표는 create-drop, 세션 표는 같은 마이그레이션 파일을 sql.init 으로
  # 마이그레이션 자체는 FlywayMigrationTest 가 깨끗한 스키마에 돌려 확인
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V3__spring_session.sql
  session:
    jdbc:
      initialize-schema: never

  # 운영 application.yml 과 같은 값. 테스트 설정 파일이 운영 것을 통째로 가리므로 다시 적음
  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# 운영 application.yml 과 같은 값(ConfigParityTest 가 같은지 확인). 테스트 설정이 운영 것을 통째로 가리므로 다시 적음
server:
  servlet:
    session:
      timeout: 14d
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: false
        max-age: 14d

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# CSRF 필터 비활성. @WebMvcTest 쓰기 테스트의 403 방지, 필터는 CsrfTokenFilterTest 에서 검증
odolog:
  cors:
    allowed-origins: http://localhost:5173
  csrf:
    enabled: false
  app:
    base-url: http://localhost:5173
