spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/odolog_test
    # 로컬 테스트 전용 계정. odolog_test 스키마 권한만
    username: odolog_test
    password: odolog_test

  # JavaMailSender 빈 생성용 값. 실제 발송 없음
  mail:
    host: localhost
    port: 25

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# CSRF 필터 비활성. @WebMvcTest 쓰기 테스트의 403 방지, 필터는 CsrfTokenFilterTest 에서 검증
odolog:
  csrf:
    enabled: false
  app:
    base-url: http://localhost:5173
