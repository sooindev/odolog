spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/cartree_test
    # 로컬 전용 테스트 계정. cartree_test 스키마에만 권한이 있고
    # 매 실행마다 비워지므로 실제 자격증명이 아니다.
    username: cartree_test
    password: cartree_test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
