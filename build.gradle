plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.odolog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 비밀번호 재설정 링크 발송
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    // 세션을 DB 에 보관. 재시작해도 로그인 유지, 다른 기기 세션 끊기도 DB 기준
    implementation 'org.springframework.session:spring-session-jdbc'
    // 스키마 변경 이력. ddl-auto 가 지우지도 바꾸지도 않던 제약·컬럼을 코드로 남김
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // 앱은 OdoLogApplication.main 에서 시간대를 고정하는데 테스트는 main 을 거치지 않는다.
    // 그대로 두면 LocalDate.now()·LocalDateTime.now() 를 쓰는 테스트가 CI(UTC)와 로컬(KST)에서
    // 다른 조건으로 돌아, 날짜 경계에서만 깨지는 테스트가 생긴다
    systemProperty 'user.timezone', 'Asia/Seoul'
}
