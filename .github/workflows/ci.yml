# 커밋마다 테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest

    # 실제 MariaDB 사용. H2 는 ddl-auto 스키마가 운영과 다름
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          # src/test/resources/application.yml 과 같은 값
          MARIADB_DATABASE: odolog_test
          MARIADB_USER: odolog_test
          MARIADB_PASSWORD: odolog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # cleanTest: 캐시 복원 시 test 가 up-to-date 로 건너뛰는 것 방지
      - run: ./gradlew cleanTest test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: build/reports/tests/test

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 설치
      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # build 에 tsc -b 포함
      - run: npm run build
