# main 푸시·PR 마다 테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest

    # 실제 MariaDB 사용. H2 는 스키마·잠금 동작이 운영과 다름
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          # src/test/resources/application.yml 과 같은 값
          MARIADB_DATABASE: odolog_test
          MARIADB_USER: odolog_test
          MARIADB_PASSWORD: odolog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # cleanTest: 캐시 복원 시 test 가 up-to-date 로 건너뛰는 것 방지
      - run: ./gradlew cleanTest test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: build/reports/tests/test

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 설치
      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # build 에 tsc -b 포함
      - run: npm run build

  e2e:
    name: E2E (실제 브라우저)
    runs-on: ubuntu-latest

    # 백엔드는 테스트 설정(bootTestRun)으로 같은 odolog_test 를 씀
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: odolog_test
          MARIADB_USER: odolog_test
          MARIADB_PASSWORD: odolog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts 가 백엔드(18080)와 화면(5174)을 띄운다
      - run: npm run e2e
        working-directory: frontend

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results

