<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Referer 미전송. 재설정 토큰이 주소에 실리는 화면 보호 -->
    <meta name="referrer" content="no-referrer" />
    <!-- 모바일 주소창 색. ThemeProvider 가 테마에 맞춰 교체 -->
    <meta name="theme-color" content="#f4f4f6" />
    <meta name="description" content="차량 정비 이력을 기록하고 다음 정비 시점을 확인하는 앱" />
    <title>오도로그</title>
    <script>
      // 첫 화면 그리기 전 테마 클래스 적용. React 로는 막을 수 없는 깜빡임(FOUC) 방지
      // 'odolog-theme' 은 ThemeContext.ts, '#17171a' 는 index.css·ThemeProvider.tsx 와 중복(함께 수정)
      ;(function () {
        try {
          var stored = localStorage.getItem('odolog-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)

          if (dark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17171a')
          }
        } catch (error) {
          // localStorage 차단 환경은 라이트로 시작
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
