<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Referer 를 아예 보내지 않는다. /reset-password?token=... 는 이 화면이 띄우는 주소라
      백엔드 필터가 닿지 않는다 — 그 화면에서 나가는 요청에 토큰이 실리는 것을 여기서 막는다.
    -->
    <meta name="referrer" content="no-referrer" />
    <!-- 모바일 브라우저가 주소창을 칠하는 색. ThemeProvider가 테마에 맞춰 바꿔 끼운다. -->
    <meta name="theme-color" content="#f4f4f6" />
    <meta name="description" content="차량 정비 이력을 기록하고 다음 정비 시점을 확인하는 앱" />
    <title>오도로그</title>
    <script>
      /*
       * 이 스크립트는 React보다 먼저, 그리고 <body>가 그려지기 전에 실행돼야 한다.
       *
       * 왜 여기에 있나: 브라우저는 JS 번들을 받아 React를 띄우기 훨씬 전에 이미 첫 화면을
       * 한 번 그린다. 그때 <html>에 클래스가 없으면 라이트로 그려졌다가 React가 뜨는 순간
       * 다크로 뒤집힌다. 다크 사용자에게는 흰 화면이 한 번 번쩍이는 셈이다(FOUC).
       * 이 문제는 React 안에서는 원리적으로 해결할 수 없어서, 어쩔 수 없이 인라인 스크립트를 쓴다.
       *
       * 'odolog-theme' 문자열이 ThemeContext.ts 에도 있다. 여기서는 import 를 쓸 수 없어
       * 중복이 불가피하다 — 한쪽만 고치면 안 된다.
       * 아래 '#17171a' 도 같은 종류의 중복이다. 다크 배경색은 index.css(--background) 와
       * ThemeProvider.tsx 에도 있고, 세 곳이 어긋나면 주소창만 다른 색으로 남는다.
       */
      ;(function () {
        try {
          var stored = localStorage.getItem('odolog-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)

          if (dark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17171a')
          }
        } catch (error) {
          /* localStorage를 막아 둔 브라우저. 라이트로 시작한다. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
